name: Yunzhou 2.0 Voice MP3

on:
  workflow_dispatch:
    inputs:
      text:
        description: '要转换为语音的文字（最多 1000 字符）'
        required: true
        type: string
        default: '你有没有发现，天天在用人工智能，工作还是忙不完？复制资料、整理表格、写报告，这些重复工作能不能交给人工智能？DeepSeek Harness 是 DeepSeek 推出的开源智能体运行环境。它可以在获得权限后读取工作区文件、调用工具、执行多步骤任务。但它不是万能的自动员工，结果仍然需要人来检查。新手可以先安装 Node.js，用官方命令启动网页界面。接着设置模型，选择一个专用测试文件夹。请记住，不要把真实客户数据或 API 密钥放进示范环境。比如经营网店，可以准备一份模拟销售表，要求 AI 汇总产品销量、销售额和排名。我们这份演示数据一共八千五百三十元，销售额最高的是 D 产品。正式拍摄时，要让观众看到真实操作和生成结果。重点不是报告做得多漂亮，而是数字对不对。核对总额、异常记录和计算依据。如果涉及权限申请，先看清再批准。AI 会做事情，不代表它不会犯错。普通人想打造 AI 数字员工，先从一个小任务开始：明确目标、让 AI 执行、人工验收，再考虑自动化。关注陈文颖一人公司，一起用务实的方法学人工智能，少走弯路。'

permissions:
  contents: read

jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate MP3
        env:
          VOLCENGINE_TTS_API_KEY: ${{ secrets.VOLCENGINE_TTS_API_KEY }}
          TTS_TEXT: ${{ inputs.text }}
        run: python scripts/yunzhou_tts.py
      - name: Downloadable MP3
        uses: actions/upload-artifact@v4
        with:
          name: yunzhou2-mp3
          path: output/tts/yunzhou2.mp3
          if-no-files-found: error
          retention-days: 7
